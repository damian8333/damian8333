<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My KPI Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <h1>My Dashboard</h1>
      <div class="actions">
        <button id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
      </div>
    </header>
    <main>
      <section class="kpi-grid">
        <div class="kpi-card">
          <h2>Total Sales</h2>
          <p id="sales" class="kpi-value">$123,456</p>
        </div>
        <div class="kpi-card">
          <h2>Active Users</h2>
          <p id="users" class="kpi-value">789</p>
        </div>
        <div class="kpi-card">
          <h2>Conversion Rate</h2>
          <p id="conversion" class="kpi-value">5.6%</p>
        </div>
        <div class="kpi-card">
          <h2>Support Tickets</h2>
          <p id="tickets" class="kpi-value">12</p>
        </div>
      </section>
      <section class="chart-section">
        <canvas id="salesChart"></canvas>
      </section>
    </main>
    <footer>&copy; 2024 My KPI Dashboard</footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
